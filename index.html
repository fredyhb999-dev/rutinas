<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="description" content="Rutinas: planes de ejercicio con tiempos guiados, fotos y control de series.">
<title>Rutinas</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./iconos/icono-192.png">
<link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutinas">
<link rel="stylesheet" href="./estilos.css">
</head>
<body>

<!-- ============ INICIO ============ -->
<section class="pantalla activa" id="pantalla-inicio" data-pantalla="inicio">
  <header class="barra">
    <div class="marca"><span class="marca-punto"></span>RUTINAS</div>
    <div class="barra-der">
      <span class="chip-racha" id="chip-racha" hidden></span>
      <button class="btn-icono" data-accion="ir-config" aria-label="Configuración" title="Configuración">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.8a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.44h.08A1.7 1.7 0 0 0 10.11 2.9V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.5 9v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
      </button>
    </div>
  </header>

  <main class="contenido inicio">
    <p class="saludo"><strong id="saludo-texto">Hola</strong><span id="saludo-sub">A entrenar</span></p>

    <article class="tarjeta-hoy" id="tarjeta-hoy">
      <div class="tarjeta-hoy-cab">
        <span class="etiqueta" id="hoy-etiqueta">HOY</span>
        <span class="punto" id="hoy-punto"></span>
      </div>
      <h1 id="hoy-nombre">Sin plan</h1>
      <p class="tarjeta-hoy-meta" id="hoy-meta">Asigna un plan a este día</p>
      <div class="tarjeta-hoy-botones">
        <button class="btn btn-principal" data-accion="comenzar" id="btn-comenzar">Comenzar</button>
        <button class="btn btn-secundario" data-accion="elegir-plan" id="btn-elegir">Elegir plan</button>
      </div>
      <button class="btn-texto btn-reanudar" data-accion="reanudar" id="btn-reanudar" hidden>Reanudar entrenamiento</button>
    </article>

    <div class="bloque">
      <div class="bloque-cab">
        <h2>Tu semana</h2>
        <button class="btn-texto" data-accion="ir-planes">Editar</button>
      </div>
      <div class="tira-semana" id="tira-semana"></div>
    </div>

    <div class="bloque" id="bloque-historial" hidden>
      <div class="bloque-cab"><h2>Últimos entrenamientos</h2></div>
      <div class="lista-historial" id="lista-historial"></div>
    </div>
  </main>
</section>
<!-- ============ ENTRENAR (vista previa) ============ -->
<section class="pantalla" id="pantalla-entrenar" data-pantalla="entrenar">
  <header class="barra">
    <button class="btn-icono" data-accion="ir-inicio" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="barra-titulo" id="entrenar-titulo">Plan</div>
    <button class="btn-icono" data-accion="elegir-plan" aria-label="Cambiar plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>
    </button>
  </header>

  <main class="contenido">
    <div class="datos-plan">
      <div class="dato"><span id="ent-tiempo">--</span><small>duración</small></div>
      <div class="dato"><span id="ent-sets">--</span><small>series</small></div>
      <div class="dato"><span id="ent-reps">--</span><small>reps</small></div>
    </div>
    <div class="lista-entradas" id="lista-entradas"></div>
  </main>

  <div class="acciones-fijas">
    <button class="btn btn-principal btn-grande" data-accion="iniciar" id="btn-iniciar">Comenzar entrenamiento</button>
  </div>
</section>

<!-- ============ RUNNER ============ -->
<section class="pantalla runner" id="pantalla-runner" data-pantalla="runner">
  <header class="barra">
    <button class="btn-icono" data-accion="salir-runner" aria-label="Salir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="runner-barra-medio">
      <span id="runner-plan">Plan</span>
      <strong id="runner-restante-total">--:--</strong>
    </div>
    <button class="btn-icono" id="btn-voz" data-accion="voz" aria-label="Voz">
      <svg class="ico-voz-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 8.8H3v6.4h3.5L11 19z"/><path d="M15.4 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.4a8 8 0 0 1 0 11.2"/></svg>
      <svg class="ico-voz-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 8.8H3v6.4h3.5L11 19z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </header>

  <div class="runner-progreso"><div id="runner-progreso-barra"></div></div>

  <div class="runner-cuerpo">
    <div class="fase-etiqueta" id="fase-etiqueta">PREPÁRATE</div>

    <div class="runner-foto sin-foto" id="runner-foto">
      <img id="foto-a" alt="">
      <img id="foto-b" alt="">
      <div class="runner-emoji" id="runner-emoji">💪</div>
    </div>

    <div class="anillo" id="anillo">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="anillo-fondo" cx="60" cy="60" r="54"/>
        <circle class="anillo-valor" id="anillo-valor" cx="60" cy="60" r="54"/>
      </svg>
      <div class="anillo-texto"><span id="runner-tiempo">0</span><small>s</small></div>
    </div>

    <div class="runner-info">
      <strong id="runner-ejercicio">Ejercicio</strong>
      <span id="runner-detalle">Prepárate</span>
    </div>
  </div>

  <footer class="runner-controles">
    <button class="btn-redondo" id="btn-extra" data-accion="extra" hidden>+30 s</button>
    <button class="btn-redondo" id="btn-regresar" data-accion="regresar" aria-label="Regresar una repetición" title="Regresar una repetición">
      <svg class="ico-volver" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13a1 1 0 0 0 1.55.83l8.5-6.5a1 1 0 0 0 0-1.66l-8.5-6.5A1 1 0 0 0 5 5.5z"/><rect x="16.5" y="5" width="2.5" height="14" rx="1.2"/></svg>
    </button>
    <button class="btn-redondo btn-pausa" id="btn-pausa" data-accion="pausa" aria-label="Pausa">
      <svg class="ico-pausa" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1.4"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.4"/></svg>
      <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <button class="btn-redondo" data-accion="saltar" aria-label="Saltar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13a1 1 0 0 0 1.55.83l8.5-6.5a1 1 0 0 0 0-1.66l-8.5-6.5A1 1 0 0 0 5 5.5z"/><rect x="16.5" y="5" width="2.5" height="14" rx="1.2"/></svg>
    </button>
  </footer>
</section>
<!-- ============ RESUMEN ============ -->
<section class="pantalla" id="pantalla-resumen" data-pantalla="resumen">
  <main class="contenido resumen">
    <div class="resumen-icono">✓</div>
    <h1>¡Buen trabajo!</h1>
    <p class="resumen-sub" id="resumen-plan">Plan</p>

    <div class="datos-plan">
      <div class="dato"><span id="res-tiempo">--</span><small>tiempo real</small></div>
      <div class="dato"><span id="res-estimado">--</span><small>estimado</small></div>
    </div>
    <div class="datos-plan">
      <div class="dato"><span id="res-sets">--</span><small>series</small></div>
      <div class="dato"><span id="res-reps">--</span><small>reps</small></div>
    </div>

    <div class="resumen-racha" id="resumen-racha"></div>
    <button class="btn btn-principal btn-grande" data-accion="cerrar-resumen" id="btn-cerrar-resumen">Listo</button>
  </main>
</section>

<!-- ============ CONFIGURACIÓN ============ -->
<section class="pantalla" id="pantalla-config" data-pantalla="config">
  <header class="barra">
    <button class="btn-icono" data-accion="ir-inicio" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="barra-titulo">Configuración</div>
    <span class="btn-icono invisible" aria-hidden="true"></span>
  </header>

  <div class="tabs" id="tabs-config">
    <button class="tab activo" data-accion="tab" data-tab="ejercicios">Ejercicios</button>
    <button class="tab" data-accion="tab" data-tab="planes">Planes</button>
    <button class="tab" data-accion="tab" data-tab="ajustes">Ajustes</button>
  </div>

  <main class="contenido config">
    <div class="tab-panel activo" id="panel-ejercicios"></div>
    <div class="tab-panel" id="panel-planes"></div>
    <div class="tab-panel" id="panel-ajustes"></div>
  </main>
</section>

<!-- ============ HOJA / DIALOG ============ -->
<div class="hoja-fondo" id="hoja-fondo" hidden>
  <div class="hoja" id="hoja" role="dialog" aria-modal="true">
    <div class="hoja-cab">
      <h2 id="hoja-titulo"></h2>
      <button class="btn-icono" data-accion="cerrar-hoja" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="input-importar" accept=".json,application/json" hidden>

<script src="./db.js"></script>
<script src="./app.js"></script>
</body>
</html>
